<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="https://arf20.con/style.css">
        <title>ARFNET</title>
        <style>
.center-box {
    border: 1px;
    border-style: double;
    width: 170px;
    margin: auto;
    padding: 30px;
}

.box {
    border: 1px;
    border-style: double;
    padding: 30px;
    margin: 10px;
}

.roombox {
    width: 100px;
}
        </style>
    </head>

    <body>
        <header><a href="http://arf20.com">
            <img src="http://arf20.com/arfnet_logo.png" width="64"><span class="title"><strong>ARFNET</strong></span>
        </a></header>
        <hr>
        <main>
            <h2 class="center">Chat</h2>
            <p>Chat with ARFNET users</p>
            <div id="username-box" class="center-box">
                <h3>Join</h3>
                <label for="username">Username</label><br>
                <input type="text" id="username">
                <button type="button" onclick="set_user();">Set</button>
            </div>
            <div id="chat-box" class="box">
                <h3>Chatrooms</h3>
                <label for="roomlist">Room</label><br>
                <select id="roomlist" size="10" class="roombox">
                    
                </select><br>
                <button type="button" onclick="set_room();">Join</button>
            </div>
        </main>
    </body>

    <script>
        username_box = document.getElementById("username-box");
        chat_box = document.getElementById("chat-box");
        username_box.style.display = 'block';
        chat_box.style.display = 'none';

        const socket = new WebSocket('ws://localhost:42070');
        socket.binaryType = "arraybuffer";

        // protocol values
        magic = 0x6942;

        const types = {
            TYPE_NOP: 0x00,
            TYPE_PING: 0x01,
            TYPE_PONG: 0x02,
            TYPE_JOIN: 0x03,
            TYPE_RMSG: 0x04
        };

        // user status
        username = null;
        uid = Math.floor(Math.random() * 0x100000000);
        room = null;

        // discovered rooms
        rooms = Array();

        socket.onmessage = function(event) {
            Console.log(event)
        };

        function set_header(buff, type) {
            let view1 = new Uint8Array(buff);
            let view2 = new Uint16Array(buff);
            let view4 = new Uint32Array(buff);
            view4[0] = magic;       // magic
            view1[4] = type;   // type
            view1[5] = 0x00;        // flags
            view2[3] = 0x0000;      // length
            view4[2] = uid;         // source uid
        }

        function send_ping() {
            let buff = new ArrayBuffer(12);
            set_header(buff, types.TYPE_PING); 
            socket.send(buff);
        }

        function set_user() {
            username = document.getElementById("username").value;
            send_ping();

            username_box.style.display = 'none';
            chat_box.style.display = 'block';
        }
    </script>
</html>
